name: astrbot_plugin_jrys
display_name: 今日运势签到
author: Miku
version: 1.3.1
desc: 今日运势签到插件 - AstrBot HTML 渲染版
short_desc: 使用浏览器截图复刻 Koishi jrys-fix 风格的图片运势签到。
url: "https://github.com/fiatlux2333/astrbot_plugin_jrys"
usage: 发送 /jrys 查看今日运势并签到；可在配置中设置 background_url 为背景图 API 或本地图片路径。
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - wecom_ai_bot
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - vocechat
  - weixin_official_account
  - weixin_oc
  - satori
  - misskey
  - line
  - matrix
  - mattermost
commands:
  - name: jrys
    desc: 查看今日运势并签到
    usage: /jrys